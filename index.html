<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scroll Check by ScrollWell Europe: a free 3-minute self-check on how social media affects you, with a 4-week plan of small changes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect x='16' y='24' width='120' height='96' rx='40' fill='%23FF6F59'/%3E%3Crect x='64' y='64' width='120' height='96' rx='40' fill='%23FEC601'/%3E%3C/svg%3E">
<title>Scroll Check</title>
<meta name="theme-color" content="#F7F0F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ScrollWell Europe app look: blush ground, white sticker cards, coral as the one accent per screen,
   sky for calm, sunshine for wins. Single light theme by design (the brand has no dark theme). */
:root{
  color-scheme:light;
  --blush:#F7F0F5; --blush-deep:#EFE3EC; --surface:#FFFFFF;
  --coral:#FF6F59; --coral-soft:#FFE1DB; --coral-ink:#B8432F;
  --sky:#66C7F4; --sky-soft:#DDF2FC; --sky-ink:#1A6F99;
  --sun:#FEC601; --sun-soft:#FFF1B8;
  --ink:#1F2A44; --ink-muted:#4A5470;
  --pop:0 4px 0 rgba(31,42,68,.10);
  --r-sm:12px; --r-md:20px; --r-lg:32px;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* motion: strong ease-out for UI, press feedback 120ms, screen changes under 300ms */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --press:120ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--blush)}
/* feel like an installed app: no tap flash, no font inflation, no page bounce behind the fixed tab bar */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* controls: fire on tap without the double-tap wait, never select their label on long-press */
button,a,[role="button"],input[type=range]{touch-action:manipulation}
button,[role="button"],.tab,.chip,.pick{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* every pressable answers on finger-down, not on release */
button{transition:transform var(--press) var(--ease-out),background-color 160ms ease,border-color 160ms ease,box-shadow 160ms ease}
button:not(:disabled):active{transform:scale(0.97)}
button:disabled{opacity:.4;cursor:default}
.num-t{font-variant-numeric:tabular-nums}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blush)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky-ink);font-weight:700}
:focus-visible{outline:3px solid var(--sky-ink);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance}
.app{max-width:430px;margin-inline:auto;padding-block:0 112px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(247,240,245,.82);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;transition:box-shadow 200ms ease}
/* scroll edge: a soft shadow only once content actually slides under the bar */
body.scrolled .bar{box-shadow:0 10px 16px -14px rgba(31,42,68,.35)}
.lock{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.lock svg{width:34px;height:34px;display:block}
.wm{font:600 21px/1 var(--f-display);letter-spacing:-.2px}
.wm span{background:var(--coral);border-radius:7px;padding:0 4px;margin-left:1px}
.lock small{display:block;font:800 8.5px/1 var(--f-body);letter-spacing:3px;text-transform:uppercase;margin-top:3px;text-align:left}
.badgecount{display:flex;align-items:center;gap:6px;background:var(--sun-soft);border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-size:14px}
.badgecount i{width:22px;height:22px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.badgecount i svg{width:14px;height:14px}

/* tab bar, fixed like a phone app */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -1px 0 rgba(31,42,68,.08);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:430px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;border-radius:14px;font-size:11.5px;font-weight:800;color:var(--ink-muted);white-space:nowrap}
.tab:active{transform:none}
.tab:active .ti{transform:scale(0.92)}
.ti{transition:transform var(--press) var(--ease-out),background-color 160ms ease}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ti{background:var(--coral-soft)}
.ti{width:48px;height:30px;border-radius:999px;display:grid;place-items:center}

main{padding-top:10px}
.view{display:grid;gap:16px}

/* building blocks */
.card{background:var(--surface);border-radius:var(--r-md);padding:20px;box-shadow:var(--pop);display:grid;gap:12px;min-width:0}
.eyebrow{font:800 12px/16px var(--f-body);letter-spacing:1.5px;text-transform:uppercase;color:var(--coral-ink)}
.muted{color:var(--ink-muted)}
.small{font-size:14px}
.hl{background:var(--coral);border-radius:12px;padding:0 .14em}
.hl-sun{background:var(--sun);border-radius:12px;padding:0 .14em}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.tile svg{width:26px;height:26px}
.t-coral{background:var(--coral-soft)}.t-sky{background:var(--sky-soft)}.t-sun{background:var(--sun-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 22px;font-weight:800;font-size:17px;border:0;min-height:52px;width:100%}
.btn-primary{background:var(--coral);color:var(--ink);box-shadow:var(--pop)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(31,42,68,.10)}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--blush-deep)}
.btn-row{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font:800 13.5px/18px var(--f-body);background:var(--sun-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.track{height:14px;border-radius:999px;background:var(--blush-deep);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--coral);transition:width .3s}
.linkbtn{background:none;border:0;padding:0;font-weight:800;color:var(--sky-ink);text-decoration:underline;text-underline-offset:3px}

/* welcome */
.hero{display:grid;gap:14px;padding-top:8px}
.hero h1{font-size:44px;letter-spacing:-1px;line-height:1.02}
.hero .lede{font-size:18px;color:var(--ink-muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--pop);display:grid;gap:2px;text-align:center}
.fact b{font:600 26px/1.1 var(--f-display)}
.fact span{font-size:12.5px;color:var(--ink-muted);line-height:1.3}
.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center}
.step b{display:block;font:600 19px/1.2 var(--f-display)}
.step span{font-size:14.5px;color:var(--ink-muted)}
.privacy{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-muted)}

/* quiz */
.qhead{display:grid;gap:8px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--ink-muted)}
.segs{display:grid;grid-template-columns:6fr 4fr 4fr 2fr;gap:5px}
.seg{height:10px;border-radius:999px;background:var(--blush-deep);overflow:hidden}
.seg i{display:block;height:100%;background:var(--coral);border-radius:999px;transition:width .25s}
.segl{display:grid;grid-template-columns:6fr 4fr 4fr 2fr;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted)}
.segl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segl .on{color:var(--coral-ink)}
.qcard{display:grid;gap:16px;background:var(--surface);border-radius:var(--r-lg);padding:22px 18px;box-shadow:var(--pop)}
.qtop{display:flex;gap:12px;align-items:center}
.qstem{font-size:14px;font-weight:700;color:var(--ink-muted)}
.qtext{font:600 25px/1.15 var(--f-display);text-wrap:balance}
.qhint{font-size:14px;color:var(--ink-muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--blush);border:2px solid transparent;border-radius:16px;padding:12px 14px;font-size:16px;font-weight:700;min-height:52px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-muted)}
.opt[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral)}
.opt[aria-pressed="true"] .k{background:var(--coral);color:var(--ink)}
.pick{border:2px solid var(--blush-deep);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:800;min-height:42px}
.pick[aria-pressed="true"]{background:var(--sky);border-color:var(--sky)}
.timeread{font:600 52px/1 var(--f-display);letter-spacing:-1px}
.timeread small{font:700 16px var(--f-body);color:var(--ink-muted);margin-left:6px;letter-spacing:0}
/* a slider you can actually grab with a thumb: 32px knob on a thick track */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:var(--blush-deep)}
input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:var(--blush-deep)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-10px;border-radius:50%;background:var(--coral);border:4px solid var(--surface);box-shadow:var(--pop)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--coral);border:4px solid var(--surface);box-shadow:var(--pop)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets .pick{min-height:40px;padding:6px 14px;font-size:14px}
.scale11{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale11 .opt{justify-content:center;padding:10px 0;font:600 20px/1 var(--f-display);min-height:48px}
.ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-muted)}
.qnav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
/* questions slide in from the side you are travelling to: forward from the right, back from the left */
.in-fwd{animation:in-fwd 240ms var(--ease-out)}
.in-back{animation:in-back 240ms var(--ease-out)}
@keyframes in-fwd{from{opacity:0;transform:translateX(18px)}}
@keyframes in-back{from{opacity:0;transform:translateX(-18px)}}
/* result and plan cards arrive in a short cascade; rare screens, so a little delight is fine */
.stagger>*{animation:rise 320ms var(--ease-out) both}
.stagger>*:nth-child(2){animation-delay:40ms}.stagger>*:nth-child(3){animation-delay:80ms}
.stagger>*:nth-child(4){animation-delay:120ms}.stagger>*:nth-child(5){animation-delay:160ms}
.stagger>*:nth-child(n+6){animation-delay:200ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.resume{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:var(--r-md);padding:14px 16px}
.resume p{flex:1;font-size:14.5px;font-weight:700}
.resume .btn{width:auto;min-height:44px;padding:10px 18px;font-size:15px}

/* results */
.note{font-size:14px;background:var(--sun-soft);border-radius:var(--r-sm);padding:10px 12px}
.pcard{border-radius:var(--r-lg);padding:22px;display:grid;gap:12px;box-shadow:var(--pop)}
.pcard h1{font-size:34px;letter-spacing:-.5px}
.pcard .lede{font-size:16px}
.meter{display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-top b{font:600 17px/1.2 var(--f-display)}
.meter-top span{font:600 22px/1 var(--f-display)}
.meter-top small{font:700 13px var(--f-body);color:var(--ink-muted)}
.lvl{font-size:13px;font-weight:800;color:var(--ink-muted)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bat{width:64px;height:118px;border:4px solid var(--ink);border-radius:16px;padding:5px;display:flex;flex-direction:column-reverse;gap:4px;position:relative;margin-inline:auto}
.bat::before{content:"";position:absolute;top:-11px;left:18px;width:20px;height:7px;border-radius:4px 4px 0 0;background:var(--ink)}
.bat i{display:block;flex:1;border-radius:6px;background:var(--blush-deep)}
.bat i.f{background:var(--sky)}
.center{text-align:center;justify-items:center}
.big{font:600 30px/1 var(--f-display)}
.insight{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.insight b{display:block;font:600 17px/1.2 var(--f-display)}
.insight span{font-size:14px;color:var(--ink-muted)}
.support{background:var(--sky-soft);box-shadow:none}

/* plan */
.levelcard{display:grid;gap:10px}
.lv{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--ink-muted);text-align:center;line-height:1.2}
.lv span{display:flex;flex-direction:column;align-items:center;gap:5px;width:20%}
.lv i{display:block;width:14px;height:14px;border-radius:50%;background:var(--blush-deep)}
.lv .done i{background:var(--coral)}
.lv .now{color:var(--ink)}
.lv .now i{background:var(--surface);border:4px solid var(--coral)}
.week{display:grid;gap:10px}
.week-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.week-h h2{font-size:21px}
.week-h span{font-size:13px;font-weight:800;color:var(--ink-muted)}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--pop)}
.act.done{background:var(--sun-soft);box-shadow:none}
.act.done .at{text-decoration:line-through;text-decoration-thickness:2px}
.tick{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--blush-deep);background:var(--surface);display:grid;place-items:center;padding:0;margin:-4px}
.tick.pop{animation:pop 280ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.tick svg{opacity:0;width:18px;height:18px}
.tick[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.tick[aria-pressed="true"] svg{opacity:1}
.at{font:600 17px/1.2 var(--f-display)}
.ah{font-size:14px;color:var(--ink-muted);margin-top:3px}
.am{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--blush)}
.tag.q{background:var(--sky-soft)}
.tag.fit{background:var(--coral-soft)}
.rm{width:44px;height:44px;margin:-8px -8px 0 0;border-radius:50%;border:0;background:none;color:var(--ink-muted);display:grid;place-items:center;padding:0}
.rm:active{background:var(--blush)}
/* hover only where a real pointer can hover, so it never sticks after a tap */
@media (hover:hover) and (pointer:fine){
  .rm:hover{background:var(--blush)}
  .opt:hover{border-color:var(--blush-deep)}
  .pick:hover,.addto button:hover,.filt button:hover{border-color:var(--ink-muted)}
  .btn-ghost:hover{box-shadow:inset 0 0 0 2px var(--ink-muted)}
}
.undo{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;width:min(398px,calc(100% - 32px));display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--blush);border-radius:var(--r-md);padding:12px 12px 12px 18px;box-shadow:0 12px 28px -12px rgba(31,42,68,.6);
  transform:translate(-50%,0);opacity:1;transition:transform 260ms var(--ease-out),opacity 200ms ease}
.undo[hidden]{display:flex!important;transform:translate(-50%,16px);opacity:0;pointer-events:none;visibility:hidden;transition:transform 180ms ease,opacity 150ms ease,visibility 0s 180ms}
.undo p{flex:1;font-size:14.5px;font-weight:700;min-width:0}
.undo button{border:0;background:var(--sun);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;min-height:40px}
.addto{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink-muted)}
.addto button{border:2px solid var(--blush-deep);background:var(--surface);border-radius:999px;min-width:44px;height:40px;font-weight:800;font-size:14px;padding:0 12px}
.pool .act{grid-template-columns:1fr}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{border:2px solid var(--blush-deep);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:800}
.filt button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--blush)}
.empty{font-size:14px;color:var(--ink-muted);padding:12px 14px;border:2px dashed var(--blush-deep);border-radius:var(--r-md)}
.toast{font-size:14px;font-weight:800;color:var(--coral-ink);min-height:1.4em}
textarea.fb{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--blush-deep);padding:10px;background:var(--surface);color:var(--ink)}

/* progress */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800;color:var(--ink-muted)}
.d{width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--blush-deep);display:grid;place-items:center}
.d svg{width:20px;height:20px;opacity:0}
.d.y{background:var(--sun)}
.d.y svg{opacity:1}
.d.today{box-shadow:0 0 0 3px var(--coral)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.bd{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:800;line-height:1.25}
.bd i{width:58px;height:58px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:var(--pop)}
.bd i svg{width:28px;height:28px}
.bd.lock i{background:var(--blush-deep);box-shadow:none}
.bd.lock i svg{opacity:.45}
.bd.lock{color:var(--ink-muted)}

/* good news: a finite daily set, never an endless feed */
.ndots{display:flex;gap:6px;align-items:center}
.ndots i{width:28px;height:8px;border-radius:999px;background:var(--blush-deep);transition:background-color 300ms ease}
.ndots i.on{background:var(--sun)}
.ndots span{font-size:13px;font-weight:800;color:var(--ink-muted);margin-left:6px}
.story{gap:10px}
.story .nh{display:flex;gap:12px;align-items:center}
.story .nh .tile{width:44px;height:44px;border-radius:14px}
.ncat{font:800 11.5px/1.2 var(--f-body);letter-spacing:1.2px;text-transform:uppercase;color:var(--coral-ink)}
.nplace{font-size:13px;font-weight:700;color:var(--ink-muted)}
.story h2{font-size:22px;letter-spacing:-.2px}
.story p.body{font-size:15.5px;color:var(--ink-muted);line-height:1.5}
.nwin{display:flex;gap:8px;align-items:center;background:var(--sun-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;font-weight:800}
.nwin svg{width:18px;height:18px;flex:none}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nfoot a{font-size:13.5px}
.smile{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--blush-deep);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;font-size:14px;font-weight:800}
.smile svg{width:18px;height:18px}
.smile[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.smile.pop{animation:pop 280ms var(--ease-out)}
.done-card{background:var(--sky-soft);box-shadow:none;text-align:center;justify-items:center}
.done-card .tile{width:64px;height:64px;border-radius:50%;background:var(--surface)}
.rules summary{cursor:pointer;font:600 17px/1.3 var(--f-display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"+";font:600 22px/1 var(--f-display);color:var(--ink-muted)}
.rules[open] summary::after{content:"−"}
.rules ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px;color:var(--ink-muted)}
.planlink{margin-top:10px;border:0;background:var(--sky-soft);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:800;font-size:14px}
@media (hover:hover) and (pointer:fine){ .smile:hover{border-color:var(--ink-muted)} }

/* about */
.prose{display:grid;gap:12px}
.prose h2{font-size:22px;margin-top:6px}
.prose p,.prose li{color:var(--ink-muted)}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.help{font-size:13px;color:var(--ink-muted);display:grid;gap:4px;padding-top:6px}
.help b{color:var(--ink)}
.num{font-weight:800;user-select:all}

/* reduced motion keeps gentle fades that aid understanding, drops all movement */
@media (prefers-reduced-motion:reduce){
  *{transition-property:opacity,background-color,border-color!important}
  .in-fwd,.in-back,.stagger>*{animation:fadeonly 160ms ease both!important}
  .tick.pop{animation:none!important}
  button:not(:disabled):active,.tab:active .ti{transform:none!important}
}
@keyframes fadeonly{from{opacity:0}}

}

  const boost = { M01:a.TRIGGER === "fomo", M02:a.TIME >= 180, M03:a.BED >= 3.5, M08:a.BED >= 1.5, M06:a.MORNING === 1,
    M05:a.TRIGGER === "habit", A01:["boredom","habit"].includes(a.TRIGGER), M09:a.TRIGGER === "stress", A05:a.TRIGGER === "lonely",
    A02:(a.APPS || []).some(p => ["TikTok","Instagram","X"].includes(p)), A03:(a.APPS || []).includes("Instagram"), M10:a.TIME >= 240, M07:a.TIME >= 240,
    A07:a.MORNING === 1 };
  const ranked = ACTIONS.map(x => ({ id:x.id, e:x.e, cat:x.cat,
    sc: 1.5 * (x.w[0] * zP + x.w[1] * zC + x.w[2] * zL) + (boost[x.id] ? .35 : 0) + (x.goal.includes(a.GOAL) ? .5 : 0) + .8 * ((x.yes ?? 45) / 100) }))
    .sort((p, q) => q.sc - p.sc);
  if (s.ls <= 4) { const i = ranked.findIndex(x => x.id === "A06"); ranked.unshift(...ranked.splice(i, 1)); }
  const slots = [{ n:3, ok:e => e === 1 }, { n:3, ok:e => e <= 2 }, { n:2, ok:e => e >= 1 }, { n:2, ok:e => e >= 2 }];
  const used = new Set(), weeks = [[], [], [], []];
  slots.forEach((slot, w) => {
    const pick = (strict) => { for (const c of ranked) {
      if (weeks[w].length >= slot.n) return;
      if (used.has(c.id) || (c.id === "A06" && s.ls > 4)) continue;
      if (strict && !slot.ok(c.e)) continue;
      weeks[w].push(c.id); used.add(c.id);
    } };
    pick(true); pick(false);
  });
  return { weeks, done:{} };
}

/* ------------------------------------------------------------ navigation */
function setView(v, top = true) {
  S.view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === v)));
  document.querySelectorAll(".view").forEach(el => { el.hidden = el.id !== `v-${v}`; });
  S.enter = true; // the first render of a screen may cascade in; re-renders after a tap must not
  ({ check:renderCheck, plan:renderPlan, news:renderNews, progress:renderProgress, about:renderAbout })[v]();
  S.enter = false;
  try { history.replaceState(null, "", v === "check" ? location.pathname + location.search : `#${v}`); } catch {}
  if (top) window.scrollTo({ top:0 });
  renderBadgeCount();
}

/* dir: 1 = forward, -1 = back, 0 = same question re-rendered (no motion) */

/* one answer per question: a double tap during the short confirmation pause must not skip a question */
function choose(b, viaKey = false) {
  if (S.advancing) return;
  const q = QUESTIONS[S.qi];
  S.answers[q.id] = JSON.parse(b.dataset.v);
  document.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  S.advancing = true;
  setTimeout(() => { S.advancing = false; next(viaKey); }, viaKey ? 0 : 180); // a beat so the tap registers visibly
}
function next(viaKey = false) {
  if (S.qi < QUESTIONS.length - 1) { S.qi++; renderQuestion(viaKey ? 0 : 1); window.scrollTo({ top:0 }); }
  else finish(S.answers, false);
}
function back(viaKey = false) { if (S.qi > 0) { S.qi--; renderQuestion(viaKey === true ? 0 : -1); } }
/* keyboard on desktop: number keys answer, Enter continues, Left goes back; no motion for key presses */
document.addEventListener("keydown", (e) => {
  if (S.view !== "check" || S.screen !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = QUESTIONS[S.qi];
  if (e.key === "ArrowLeft") { back(true); return; }
  if (e.key === "Enter" && (q.type === "time" || q.type === "multi") && document.activeElement?.tagName !== "BUTTON") { next(true); return; }
  if (/^[0-9]$/.test(e.key) && q.type !== "time" && q.type !== "multi") {
    const opts = [...document.querySelectorAll(".opt")];
    const b = q.type === "scale11" ? opts[+e.key] : opts[+e.key - 1];
    if (b) choose(b, true);
  }
});

function finish(answers, example) {

  S.saved.plan = recommend(answers, s);
  if (!example) { S.saved.checkins = S.saved.checkins || []; store.set(S.saved); }
  S.screen = "result"; setView("check");
}

  const el = $("#v-news"), list = todaysNews(), t = today();
  const N = S.saved.news ||= { date:t, seen:[], smiles:[], days:[] };
  if (N.date !== t) { N.date = t; N.seen = []; }
  const seen = new Set(N.seen), smiles = new Set(N.smiles), nSeen = list.filter(x => seen.has(x.id)).length;
  const inPlan = S.saved.plan?.weeks.flat().includes("A07");
  el.className = "view" + (S.enter ? " stagger" : "");
  el.innerHTML = `
    <div class="hero" style="gap:8px"><span class="eyebrow">Good news</span>
      <h1 style="font-size:36px">Five good things, <span class="hl-sun">then done</span></h1>
      <p class="muted">Short, true stories about nature, animals, science and people working together. A fixed five a day, never an endless feed.</p>
      <div class="ndots" role="img" aria-label="${nSeen} of ${list.length} read today">${list.map(x => `<i class="${seen.has(x.id) ? "on" : ""}" data-dot="${x.id}"></i>`).join("")}<span id="ncount">${nSeen} of ${list.length}</span></div></div>
    ${inPlan ? `<p class="note"><b>Part of your plan:</b> Good news first. Read these instead of your first feed of the day.</p>` : ""}
    ${list.map(x => { const c = NEWS_CATS[x.cat]; return `<article class="card story" data-story="${x.id}">
      <div class="nh"><span class="tile ${c.t}">${icon(c.ic)}</span><div><div class="ncat">${c.l}</div><div class="nplace">${esc(x.place)}, ${esc(x.when)}</div></div></div>
      <h2>${esc(x.title)}</h2>
      <p class="body">${esc(x.body)}</p>
      <div class="nwin">${icon("sun")}${esc(x.win)}</div>
      <div class="nfoot"><a href="${x.url}" target="_blank" rel="noopener">Source: ${esc(x.src)}</a>
        <button class="smile" data-smile="${x.id}" aria-pressed="${smiles.has(x.id)}">${icon("smile")}${smiles.has(x.id) ? "Made me smile" : "This made me smile"}</button></div>
    </article>`; }).join("")}
    <div class="card done-card"><span class="tile">${icon("check")}</span>
      <h2 style="font-size:24px">You're all caught up</h2>
      <p class="muted">That's today's five. New good news tomorrow. Maybe tell someone about the one you liked best.</p>
      <button class="btn btn-ghost" id="nplan" style="max-width:280px">${S.saved.plan ? "Back to my plan" : "Take the check"}</button></div>
    <details class="card rules"><summary>How we pick stories</summary>
      <ul><li>Wins of many: nature, animals, science and communities working together.</li>
        <li>No prizes, rankings, ages or rich lists, and no stories that invite you to measure yourself against one person.</li>
        <li>No likes, no follower counts, no comments.</li>
        <li>Every story is true and links to its source.</li>
        <li>Five a day, then the feed ends.</li></ul></details>`;
  el.querySelectorAll("[data-smile]").forEach(b => b.onclick = () => {
    const id = b.dataset.smile, s = new Set(N.smiles); s.has(id) ? s.delete(id) : s.add(id); N.smiles = [...s]; save();
    const on = s.has(id); b.setAttribute("aria-pressed", on); b.innerHTML = icon("smile") + (on ? "Made me smile" : "This made me smile");
    if (on) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
    renderBadgeCount();
  });
  $("#nplan").onclick = () => { if (S.saved.plan) setView("plan"); else { setView("check"); startQuiz(); } };
  // a story counts as read once most of it has been on screen; reading all five marks the day
  newsObs?.disconnect();
  if ("IntersectionObserver" in window) {
    newsObs = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const id = e.target.dataset.story; if (N.seen.includes(id)) return;
      N.seen.push(id); el.querySelector(`[data-dot="${id}"]`)?.classList.add("on");
      const n = list.filter(x => N.seen.includes(x.id)).length; $("#ncount").textContent = `${n} of ${list.length}`;
      if (n === list.length && !N.days.includes(t)) { N.days.push(t); renderBadgeCount(); }
      save();
    }), { threshold:.6 });
    el.querySelectorAll("[data-story]").forEach(a => newsObs.observe(a));
  }
}
function renderBadgeCount() {
  const n = badges().filter(b => b.on).length;
  $("#bc").innerHTML = `<i>${icon("trophy")}</i><span>${n}</span>`;
  $("#bc").setAttribute("aria-label", `${n} badges earned`);
}
function weekDays() {
  const now = new Date(), dow = (now.getDay() + 6) % 7, monday = new Date(now); monday.setDate(now.getDate() - dow);
  return Array.from({ length:7 }, (_, i) => { const x = new Date(monday); x.setDate(monday.getDate() + i); return x.toISOString().slice(0, 10); });
}
function renderProgress() {
  const el = $("#v-progress"), R = S.saved.result, plan = S.saved.plan;
  const ids = plan ? plan.weeks.flat() : [], done = ids.filter(id => plan.done[id]).length;
  const checkins = new Set(S.saved.checkins || []), days = weekDays(), t = today(), inWeek = days.filter(x => checkins.has(x)).length;
  el.innerHTML = `
    <div class="hero" style="gap:8px"><span class="eyebrow">Progress</span><h1 style="font-size:36px">Small wins <span class="hl-sun">add up</span></h1>
      <p class="muted">${R ? "Tick off actions and check in each day you stick to your plan." : "Take the check first to unlock your plan and badges."}</p></div>
    ${levelHTML(done, ids.length)}
    <div class="card"><div class="meter-top"><b>Streak this week</b><small>${inWeek} of 7 days</small></div>
      <div class="days">${days.map((x, i) => `<div><div class="d ${checkins.has(x) ? "y" : ""} ${x === t ? "today" : ""}">${icon("tick")}</div>${"MTWTFSS"[i]}</div>`).join("")}</div>
      <button class="btn ${checkins.has(t) ? "btn-ghost" : "btn-primary"}" id="ci" ${R ? "" : "disabled"}>${checkins.has(t) ? "Checked in today" : "I stuck to my plan today"}</button></div>
    <div class="card"><b style="font:600 20px var(--f-display)">Badges</b>
      <div class="badges">${badges().map(b => `<div class="bd ${b.on ? "" : "lock"}"><i>${icon(b.ic)}</i>${b.l}</div>`).join("")}</div></div>
    <div class="card"><b style="font:600 20px var(--f-display)">In four weeks</b><p class="small muted">Retake the check and see how your pull, comparing and mind battery have changed.</p>
      <button class="btn btn-ghost" id="rt">Retake the check</button></div>`;
  $("#ci").onclick = () => { if (!R) return; const set = new Set(S.saved.checkins || []); set.has(t) ? set.delete(t) : set.add(t); S.saved.checkins = [...set]; save(); renderProgress(); renderBadgeCount(); };
  $("#rt").onclick = () => { setView("check"); startQuiz(); };
}

/* ------------------------------------------------------------ ABOUT */
function renderAbout() {
  $("#v-about").innerHTML = `<div class="prose">
    <span class="eyebrow">About</span>
    <h1 style="font-size:34px">less scrolling, <span class="hl">more living</span></h1>
    <p>Scroll Check is a prototype by ScrollWell Europe, a fictional NGO created for a NOVA IMS market research project. It helps people aged 18 to 29 see how social media affects them and pick small changes they will stick to.</p>
    <h2>Built on our questionnaire</h2>
    <ul>
      <li><b>Habits:</b> the same questions as our survey (time, apps, nights, mornings, trigger).</li>
      <li><b>Pull of the apps:</b> four statements about a typical week (survey Q18).</li>
      <li><b>Comparing yourself:</b> four statements (survey Q19).</li>
      <li><b>Life satisfaction:</b> one question from 0 to 10 (survey Q15).</li>
      <li><b>Actions:</b> the ten actions rated No, Maybe or Yes in survey Q25. Actions more people said Yes to come first (first 20 answers, October 2026).</li>
    </ul>
    <h2>No comparison</h2>
    <p>You only see your own answers. There is no ranking against other people, because comparing is part of what makes social media hard.</p>
    <h2>Good news</h2>
    <p>Five short, true stories a day about nature, animals, science and communities, each with its source. We leave out prizes, rankings and individual high achievers, so there is no one to measure yourself against. When the five are read, the feed ends.</p>
    <h2>Privacy</h2>
    <p>Everything runs in your browser. Answers, plan and ticks stay on this device.</p>
    <h2>Not a diagnosis</h2>
    <p>Scores describe patterns, not conditions. If you are struggling, talk to someone you trust or a professional.</p>
    <div class="help"><span><b>Need to talk to someone?</b> Emergency anywhere in the EU: <span class="num">112</span>.</span>
      <span>Youth helplines by country: <a href="https://www.mentalhealtheurope.org/library/youth-helplines/" target="_blank" rel="noopener">Mental Health Europe</a></span>
      <span>Prototype by team Lost in Translation, NOVA IMS Market Research 2026/27.</span></div>
  </div>`;
}

/* ------------------------------------------------------------ undo snackbar */
let undoTimer = null;
function showUndo(text, undo) {
  const el = $("#undo");
  $("#undoText").textContent = text;
  $("#undoBtn").onclick = () => { clearTimeout(undoTimer); el.hidden = true; undo(); };
  el.hidden = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

/* ------------------------------------------------------------ boot */
(function boot() {
  document.querySelectorAll("[data-icon]").forEach(s => s.innerHTML = icon(s.dataset.icon));
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.view));
  $("#home").onclick = () => { S.screen = "intro"; setView("check"); };
  if (S.saved.result) S.screen = "result";
  const go = () => { const h = (location.hash || "").slice(1); setView(["plan","news","progress","about"].includes(h) ? h : "check", false); };
  window.addEventListener("hashchange", go);
  const edge = () => document.body.classList.toggle("scrolled", window.scrollY > 4);
  window.addEventListener("scroll", edge, { passive:true }); edge();
  go();
})();
</script>
</body>
</html>
